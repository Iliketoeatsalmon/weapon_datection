name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Tests only need the light deps; skip ultralytics/opencv to keep CI fast.
      - run: pip install pytest ruff pyyaml python-dotenv
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
